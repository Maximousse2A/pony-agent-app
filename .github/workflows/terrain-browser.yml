name: Verify PonyOps public demo in Chrome
on:
  push:
    branches: [qa/terrain-navigateur]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/pony-browser" --no-audit --no-fund playwright-core@1.55.0
      - name: Navigate the public prototype on mobile and desktop
        run: NODE_PATH="$RUNNER_TEMP/pony-browser/node_modules" node application/tests/browser.cjs

      - name: Keep the verified screens for visual review
        uses: actions/upload-artifact@v4
        with:
          name: ponyops-visual-qa
          path: visual-qa/*.jpg
          retention-days: 5
          if-no-files-found: error

      - name: Print compact visual contact sheets for the review
        run: |
          python -m pip -q install Pillow==11.3.0
          python - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          screens = Path('visual-qa')
          for width in (390,1440):
              size = (350,758) if width == 390 else (600,375)
              sheet = Image.new('RGB',(size[0]*2,size[1]*2),'white')
              for index,name in enumerate(('missions','depot','recu','revenus')):
                  with Image.open(screens/f'{width}-{name}.jpg') as src:
                      shot = src.resize(size,Image.Resampling.LANCZOS)
                      sheet.paste(shot,((index%2)*size[0],(index//2)*size[1]))
              buffer=io.BytesIO()
              sheet.save(buffer,'JPEG',quality=58,optimize=True)
              data=base64.b64encode(buffer.getvalue()).decode()
              for pos in range(0,len(data),1500):
                  print(f'VISUAL_{width}_{pos:07d} {data[pos:pos+1500]}')
          PY
